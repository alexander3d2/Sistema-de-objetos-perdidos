{% extends "base.html" %}
{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
    <p class="text-sm font-semibold text-primary-800">Error 404</p>
    <h1 class="page-title mt-2">Página no encontrada</h1>
    <p class="mt-3 text-slate-600">
        La dirección solicitada no existe o fue movida. Verifique la dirección o regrese al inicio.
    </p>
    <div class="mt-8">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Volver al inicio</a>
    </div>
</div>
{% endblock %}
